name: Deploy
on: 
  push:
    branches:
        - '*'
jobs:
  Upload-Server:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx (required for secrets/caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image with build-arg
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/art:latest 
      
  Deploy-Server:
    needs: Upload-Server
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: update server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_IP }}
          username: ana
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: 22
          script: |
            docker run -d -p 9000:80 sustainabletext/art:latest
